  en: Builds, tests, archives and runs Xcode projects and workspaces, with a live filterable build log, scheme and destination pickers, and simulator or device log streaming. macOS only.
  zh: 在 harness 中编译、测试、归档并运行 Xcode 工程与工作区，带实时可过滤的构建日志、scheme 与目标设备选择，以及模拟器或真机日志流。仅限 macOS。
